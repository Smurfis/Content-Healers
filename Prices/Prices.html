<!DOCTYPE html>
<html lang="en-GB">
<head>
    <link rel="icon" href="/images/Logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Prices.css">
    <meta name="author" content="❤ Content Healers ❤">
    <meta name="generator" content="Copyright of Content Healers">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>❤ Content Healers ❤</title>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Load all component CSS files first
            const cssFiles = [
                '/Components/Navbar/navbar.css',
                '/Components/Prices/Prices.css',
                '/Components/Footer/Footer.css'
            ];
            
            // Load CSS files
            cssFiles.forEach(file => {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = file;
                document.head.appendChild(link);
            });

            // Function to fetch and insert component
            async function loadComponent(url, targetSelector, position = 'beforeend') {
                try {
                    const response = await fetch(url);
                    const html = await response.text();
                    document.body.insertAdjacentHTML(position, html);
                    
                    // Add any post-loading logic
                    if (url.includes('navbar')) {
                        const currentPath = window.location.pathname;
                        const navLinks = document.querySelectorAll('.nav-link');
                        navLinks.forEach(link => {
                            if (link.getAttribute('href') === currentPath) {
                                link.classList.add('active');
                            }
                        });
                    }
                } catch (error) {
                    console.error(`Error loading component from ${url}:`, error);
                }
            }

            // Load components in sequence
            async function loadAllComponents() {
                // Create logo div
                const logoDiv = document.createElement('div');
                logoDiv.className = 'Logo';
                const logoImg = document.createElement('img');
                logoImg.className = 'Logo';
                logoImg.src = '/images/Logo.png';
                logoImg.alt = 'Content Healers Logo';
                logoDiv.appendChild(logoImg);
                document.body.appendChild(logoDiv);

                // Load components in specific order
                await loadComponent('/Components/Navbar/navbar.html', 'body', 'afterbegin');
                await loadComponent('/Components/Prices/Prices.html', '.Prices_Info');
                await loadComponent('/Components/Footer/Footer.html', 'body');

                // Make components visible after everything is loaded
                document.querySelector('.Prices_Info').style.display = 'block';
                document.querySelector('.footer').style.display = 'block';
            }

            // Start loading sequence
            loadAllComponents().catch(error => {
                console.error('Error in loading sequence:', error);
            });
        });
    </script>
</head>
<body>
    <div class="Prices_Info"></div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="Prices.js"></script>
</body>
</html>
